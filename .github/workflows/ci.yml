# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: 'Use Node.js'
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: 'npm'
    - run: npm ci #comando clean-install: comando do npm que limpa node modules antes do npm i e usa a versao do package.lock pra isntalar dependencia
    - run: npm run lint


  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: 'Use Node.js'
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: 'npm'
    - run: npm ci  
    - run: env > .env.test
    - run: npm run test:unit:all

  integration-e2e-tests:

    runs-on: ubuntu-latest

    env: 
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
    
    services:
      postgres:
        image: postgres:18
        ports:
         - 5432:5432
        env:
          POSTGRES_DB: livraria
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          

    steps:
    - uses: actions/checkout@v4

    - name: 'Use Node.js'
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: 'npm'

    - run: npm ci 

    - run: env > .env.test

    - name: Inicializa banco de dados
      env:
        PGPASSWORD: postgres
      run: | 
        psql -h localhost -U postgres -d livraria -f docker/init/01-create-tables.sql
        psql -h localhost -U postgres -d livraria -f docker/init/02-create-test-db.sql

    - run: npm run test:int:all

    - run: npm run test:e2e:all

